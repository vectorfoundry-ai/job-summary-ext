<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Job Summary Tracker</h1>
        <p id="hint" class="hint">Each tab has its own session. You can generate on several tabs at once.</p>
      </header>
      <div class="label">Current page</div>
      <div id="title" class="title">Loading…</div>
      <div id="url" class="url"></div>
      <div id="apiTarget" class="apiTarget"></div>
      <button id="summary" class="iconBtn">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l1.6 6.4L20 10l-6.4 1.6L12 18l-1.6-6.4L4 10l6.4-1.6z"/></svg>
        Generate Summary
      </button>
      <div class="secondaryActions">
        <button id="stop" class="secondary stop iconBtn" type="button" disabled>
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          Stop
        </button>
        <button id="retry" class="secondary iconBtn" type="button" disabled>
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Try again
        </button>
      </div>
      <div id="status" class="status"></div>
      <a id="dashboard" class="dashboard iconBtn" href="http://127.0.0.1:5173" target="_blank" rel="noreferrer">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-8"/></svg>
        Open dashboard
      </a>
    </div>
    <script src="api-base.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
